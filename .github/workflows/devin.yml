name: Devin plugin
on:
  push:
    paths:
      - 'plugins/devin/**'
      - 'scripts/vendor-devin-cli.mjs'
      - 'test/devin-plugin.test.mjs'
      - '.github/workflows/devin.yml'
  pull_request:
    paths:
      - 'plugins/devin/**'
      - 'scripts/vendor-devin-cli.mjs'
      - 'test/devin-plugin.test.mjs'
      - '.github/workflows/devin.yml'
permissions:
  contents: read
jobs:
  cli:
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.13.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Run the CLI shipped in the plugin
        run: node --test test/devin-plugin.test.mjs
      - name: Exercise first use without Bun and reuse the verified native executable
        run: node --test test/devin-plugin.test.mjs
        env:
          OC_DEVIN_CHECK_NATIVE: '1'
