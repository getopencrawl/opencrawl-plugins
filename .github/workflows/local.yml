name: Local lifecycle runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.13.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: node --test test/runtime.test.mjs test/codex-runtime.test.mjs
      - run: node scripts/package-local.mjs codex
      - run: node --test test/compiled-runtime.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/local/*/*.zip
            dist/local/*/SHA256SUMS
            dist/local/*/artifact.json
          retention-days: 7
