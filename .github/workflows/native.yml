name: Native plugin archives
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.13.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # Capture tests exercise a real callback deadline on each native runner.
      - run: node --test --test-concurrency=1 test/runtime.test.mjs test/codex-runtime.test.mjs test/antigravity-runtime.test.mjs test/cursor-runtime.test.mjs
      - run: node scripts/package.mjs claude-code codex antigravity cursor
      - name: Exercise each native archive
        shell: bash
        run: |
          for harness in claude-code codex antigravity cursor; do
            OC_TEST_NATIVE_HARNESS="$harness" node --test test/compiled-runtime.test.mjs || exit 1
          done
      - name: Verify workspace packages on Linux
        if: matrix.runner == 'ubuntu-24.04'
        run: OC_TEST_REPLICAS_PACKAGES=1 node --test test/replicas-runtime.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugins-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/native/*/*.zip
            dist/native/*/opencrawl-*.json
          if-no-files-found: error
          retention-days: 7
